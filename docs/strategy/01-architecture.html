<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معماری مادر | شهیدپورتال</title><style>
@font-face{font-family:Vazir;src:url('../../fonts/Vazirmatn.woff2')}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#f4f7f9;color:#172235;font-family:Vazir,Tahoma,Arial,sans-serif;line-height:2}
.layout{max-width:1240px;margin:auto;padding:24px 20px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px}
.sidebar{position:sticky;top:16px;height:calc(100vh - 32px);background:#fff;border:1px solid #dfe7ed;border-radius:20px;padding:18px 14px;box-shadow:0 10px 30px #1722350a;overflow:auto}
.brand{padding:4px 8px 16px;border-bottom:1px solid #e7edf1;margin-bottom:12px}
.brand strong{display:block;color:#123e61;font-size:18px}
.brand span{display:block;color:#718091;font-size:11px;margin-top:2px}
.menu-title{font-size:10px;color:#8a98a6;margin:12px 8px 5px}
.sidebar a{display:flex;align-items:center;gap:8px;color:#31536a;text-decoration:none;font-size:12px;padding:7px 9px;border-radius:9px;margin:2px 0}
.sidebar a:hover,.sidebar a.active{background:#edf5f8;color:#123e61}
.sidebar a:before{content:"";width:4px;height:4px;border-radius:50%;background:#5e9bb4;flex:none}
.main{min-width:0}
.hero{background:linear-gradient(135deg,#102b4e,#1b5b7b);color:#fff;border-radius:24px;padding:38px 38px;margin-bottom:18px;box-shadow:0 18px 45px #102b4e20}
.hero h1{margin:0 0 8px;font-size:30px}
.hero p{margin:3px 0;opacity:.9;font-size:14px}
.card{background:#fff;border:1px solid #e2e9ee;border-radius:19px;padding:26px;margin:16px 0;box-shadow:0 8px 24px #17223507}
.card h2{margin:0 0 12px;color:#123e61;font-size:22px}
.card h3{color:#1b5d7d;margin-bottom:5px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
.mini{background:#f8fafb;border:1px solid #e5ecf0;border-radius:14px;padding:17px}
.mini h3{margin-top:0;font-size:15px}
.mini p{margin:3px 0;color:#556676;font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;background:#e9f2f6;color:#28627d;font-size:11px;margin:2px}
.note{border-right:3px solid #3f91b5;background:#f2f7f9;padding:13px 16px;border-radius:10px;margin:14px 0;color:#345365}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.link-card{display:block;text-decoration:none;color:#173f59;background:#fff;border:1px solid #dfe8ed;border-radius:14px;padding:15px;transition:.18s}
.link-card:hover{transform:translateY(-2px);border-color:#b8cfda;background:#f8fbfc}
.link-card strong{display:block;color:#123e61;font-size:14px}
.link-card span{display:block;color:#718091;font-size:11px;margin-top:3px}
.back-top{position:fixed;left:20px;bottom:20px;z-index:20;width:42px;height:42px;border:1px solid #d7e2e9;border-radius:12px;background:#ffffffee;color:#164d70;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 8px 22px #17223518;backdrop-filter:blur(10px)}
.footer{text-align:center;color:#7b8995;font-size:11px;padding:15px}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:0;height:auto}.links{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.layout{padding:12px}.hero{padding:28px 22px}.hero h1{font-size:25px}.card{padding:20px}.grid,.links{grid-template-columns:1fr}}
.side-nav{display:block}.side-nav>a,.side-nav summary{display:flex;align-items:center;min-height:36px;padding:7px 10px;margin:3px 0;border-radius:10px;color:#31536a;text-decoration:none;font-size:12px;cursor:pointer;list-style:none}.side-nav>a:before,.side-nav summary:before{content:"";width:5px;height:5px;border-radius:50%;background:#5e9bb4;margin-left:9px;flex:none}.side-nav>a:hover,.side-nav summary:hover{background:#eef5f8;color:#123e61}.side-nav details{margin-top:5px}.side-nav summary::-webkit-details-marker{display:none}.side-nav details[open] summary{background:#f4f8fa;color:#123e61}.submenu{margin:2px 9px 6px 0;padding-right:10px;border-right:1px solid #dce7ed}.submenu a{display:block;color:#607586;text-decoration:none;font-size:11px;padding:5px 9px;border-radius:8px}.submenu a:hover{background:#edf5f8;color:#123e61}.home-link{border-bottom:1px solid #edf1f4;padding-bottom:9px!important;margin-bottom:8px!important}</style><link rel="stylesheet" href="../shared/sidebar.css"></head><body id="top"><div class="layout">
<div data-sidebar-host></div><main class="main"><section class="hero"><h1>معماری مادر</h1><p>تعریف ساختار کلان شهیدپورتال و رابطه میان هسته مرکزی، زیرسامانه‌ها و اکوسیستم.</p></section><section class="card"><h2>این صفحه برای چه است؟</h2><p>در این بخش معماری جدید را از سطح مفهومی تا معماری اجرایی برنامه‌ریزی می‌کنیم؛ شامل لایه‌ها، مرزها، وابستگی‌ها و اصول اتصال.</p></section><a class="back-top" href="#top" title="بازگشت به بالا" aria-label="بازگشت به بالا">↑</a><footer class="footer">ShahidPortal — مرکز راهبری و توسعه</footer></main></div><script src="../shared/sidebar.js" data-base="../shared"></script></body></html>

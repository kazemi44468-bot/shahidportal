<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رویدادها | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section class="pageHero"><span>بانک رویداد</span><h1>رویدادها</h1><p>واقعه‌ها، شهادت‌ها، عملیات‌ها، یادمان‌ها و دیگر نقاط مهم خط زمانی.</p></section><section id="list" class="pageList eventArchive"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const d=await loadCalendarData();document.getElementById("list").innerHTML=d.events.map(e=>"<a class='archiveItem' href='event.html?id="+e.id+"'><span>"+e.type+"</span><div><h3>"+e.title+"</h3><p>"+e.date+" · "+e.city+"</p><small>"+e.desc+"</small></div></a>").join("")})()</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>امروز | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section class="pageHero"><span>نمای روز</span><h1>امروز در تقویم شهدا</h1><p>رویدادها و یادمان‌هایی که برای تاریخ امروز در بانک محلی تقویم ثبت شده‌اند.</p></section><section class="todayPage box"><div class="todayPageDate" id="todayDate">—</div><div id="todayList" class="pageList"></div></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const fmt=new Intl.DateTimeFormat("en-US-u-ca-persian",{timeZone:"Asia/Tehran",year:"numeric",month:"numeric",day:"numeric"}),parts=d=>{const p={};fmt.formatToParts(d).forEach(x=>{if(["year","month","day"].includes(x.type))p[x.type]=Number(x.value)});return p},fa=n=>String(n).replace(/\d/g,x=>"۰۱۲۳۴۵۶۷۸۹"[x]),d=parts(new Date()),k=d.year+"/"+String(d.month).padStart(2,"0")+"/"+String(d.day).padStart(2,"0"),data=await loadCalendarData();document.getElementById("todayDate").textContent=fa(d.day)+" "+["","فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"][d.month]+" "+fa(d.year);const list=data.events.filter(e=>e.date===k);document.getElementById("todayList").innerHTML=list.length?list.map(e=>"<article><span>"+e.type+"</span><h3>"+e.title+"</h3><p>"+e.desc+"</p><small>"+e.source+"</small></article>").join(""):"<div class='emptyState'>برای امروز هنوز رویدادی در داده‌های فعلی ثبت نشده است.</div>"})()</script></body></html>

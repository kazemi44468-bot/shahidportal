<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>جست‌وجو | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section class="pageHero"><span>کشف و جست‌وجو</span><h1>جست‌وجوی تقویم</h1><p>جست‌وجو در نام، رویداد، مکان، عملیات، کلیدواژه و تاریخ.</p></section><section class="searchPage box"><input id="q" placeholder="عبارت موردنظر را وارد کنید"><button id="go">جست‌وجو</button></section><section id="out" class="pageList"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const d=await loadCalendarData(),out=document.getElementById("out"),q=document.getElementById("q"),run=()=>{const s=q.value.trim().toLowerCase(),list=d.events.filter(e=>[e.title,e.desc,e.tags,e.city,e.type,e.date].join(" ").toLowerCase().includes(s));out.innerHTML=s?list.map(e=>"<a class='archiveItem' href='event.html?id="+e.id+"'><span>"+e.type+"</span><div><h3>"+e.title+"</h3><small>"+e.date+" · "+e.city+"</small></div></a>").join(""):"<div class='emptyState'>عبارت جست‌وجو را وارد کنید.</div>"};document.getElementById("go").onclick=run;q.onkeydown=e=>{if(e.key==="Enter")run()};run()})()</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشخاص و شهدا | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section class="pageHero"><span>دانش اشخاص</span><h1>اشخاص و شهدا</h1><p>هسته‌ای برای پرونده‌های اشخاص، شهدا و چهره‌های مرتبط با رویدادهای تاریخی.</p></section><section id="list" class="entityGrid"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const d=await loadCalendarData();document.getElementById("list").innerHTML=d.martyrs.map(m=>"<a class='entityCard' href='martyr.html?id="+m.id+"'><span>پرونده شخص</span><h2>"+m.name+"</h2><p>تولد: "+m.birth+" · شهادت: "+m.martyrdom+"</p><small>"+m.place+" · "+m.source+"</small></a>").join("")||"<div class='emptyState'>هنوز پرونده‌ای در بانک محلی ثبت نشده است.</div>"})()</script></body></html>

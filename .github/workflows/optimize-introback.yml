name: Optimize intro background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build optimized WebP
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("assets/images/introback.png")
          dst = Path("assets/images/introback.webp")

          if not src.exists():
              raise SystemExit("assets/images/introback.png not found")

          im = Image.open(src).convert("RGB")
          max_width = 1920
          if im.width > max_width:
              h = round(im.height * max_width / im.width)
              im = im.resize((max_width, h), Image.Resampling.LANCZOS)

          im.save(dst, "WEBP", quality=82, method=6)
          print(f"{dst}: {im.size[0]}x{im.size[1]}, {dst.stat().st_size} bytes")
          PY

      - name: Commit optimized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/introback.webp
          git diff --cached --quiet && exit 0
          git commit -m "perf: optimize intro background image"
          git push

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پرونده شخص | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section id="profile" class="profile"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id"),d=await loadCalendarData(),m=d.martyrs.find(x=>x.id===id)||d.martyrs[0];if(!m){document.getElementById("profile").innerHTML="<div class='emptyState'>پرونده‌ای یافت نشد.</div>";return}const related=d.events.filter(e=>e.shahidId===m.id);document.title=m.name+" | تقویم شهدا";document.getElementById("profile").innerHTML="<section class='profileHead'><div class='profileSeal'>ش</div><div><span>پرونده شخص / شهید</span><h1>"+m.name+"</h1><p>"+m.place+" · "+m.country+"</p></div></section><section class='profileGrid'><article><b>مشخصات زمانی</b><p>تولد: "+m.birth+"</p><p>شهادت: "+m.martyrdom+"</p></article><article><b>رویدادهای مرتبط</b><p>"+(related.length?related.map(e=>e.title).join("، "):"هنوز رویداد مستقیمی ثبت نشده است.")+"</p></article><article><b>منبع</b><p>"+m.source+"</p><p>وضعیت: "+m.status+"</p></article></section>"})()</script></body></html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رویداد | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section id="event" class="profile"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const id=new URLSearchParams(location.search).get("id"),d=await loadCalendarData(),e=d.events.find(x=>x.id===id)||d.events[0];if(!e)return;document.title=e.title+" | تقویم شهدا";document.getElementById("event").innerHTML="<section class='profileHead'><div class='profileSeal'>رو</div><div><span>"+e.type+"</span><h1>"+e.title+"</h1><p>"+e.date+" · "+e.city+"</p></div></section><section class='profileGrid'><article><b>روایت رویداد</b><p>"+e.desc+"</p></article><article><b>کلیدواژه‌ها</b><p>"+e.tags+"</p></article><article><b>منبع و ارتباطات</b><p>"+e.source+"</p><p>"+(e.operationId||e.shahidId||"شناسه ارتباطی تکمیلی ثبت نشده است")+"</p></article></section>"})()</script></body></html>

<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3f56">
<meta name="description" content="شهیدپورتال | پورتال جامع شهدا">
<title>شهیدپورتال | پورتال جامع شهدا</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="shortcut icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/images/favicon.svg">
<link rel="preload" as="image" href="assets/images/introback.webp" type="image/webp" fetchpriority="high">
<link rel="preload" as="image" href="assets/images/logo.webp" type="image/webp" fetchpriority="high">
<style>
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Black.woff2") format("woff2");font-weight:900;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b3f56}
body{font-family:Vazirmatn,Tahoma,sans-serif}
.scene{position:relative;width:100vw;height:100vh;min-height:520px;overflow:hidden;background:#0b3f56;isolation:isolate}
.scene::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(3,32,44,.015),rgba(3,32,44,.05))}
.scene-image{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}
.identity{position:absolute;z-index:3;left:50%;top:39%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:min(88vw,780px);pointer-events:none}
.logo{display:block;width:300px;height:auto;max-width:300px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.24))}
.title{margin-top:8px;font-size:clamp(29px,3.2vw,46px);line-height:1.2;font-weight:900;color:#fff4dc;text-shadow:0 3px 14px rgba(0,35,48,.48);letter-spacing:-.04em}
.subtitle{margin-top:7px;font-size:clamp(14px,1.35vw,20px);font-weight:700;color:#f4ead8;text-shadow:0 2px 9px rgba(0,35,48,.46)}
.tagline{margin-top:10px;font-size:clamp(11px,1vw,15px);font-weight:400;color:rgba(255,255,255,.95);text-shadow:0 2px 8px rgba(0,35,48,.45)}
.ornament{width:min(22vw,240px);height:2px;margin-top:14px;background:linear-gradient(90deg,transparent,#d6ad64 22%,#f1d89e 50%,#d6ad64 78%,transparent);opacity:.95}
.enter{position:absolute;z-index:4;left:50%;top:84%;transform:translate(-50%,-50%);display:inline-flex;align-items:center;justify-content:center;gap:13px;min-width:218px;min-height:54px;padding:12px 30px 12px 26px;border:1px solid rgba(238,216,173,.78);border-radius:6px 18px 6px 18px;background:linear-gradient(180deg,rgba(9,72,93,.94),rgba(5,54,73,.96));box-shadow:0 10px 28px rgba(0,29,40,.34),inset 0 1px 0 rgba(255,255,255,.14);color:#fff7e8;text-decoration:none;font-size:clamp(13px,1.05vw,16px);font-weight:700;letter-spacing:-.01em;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);transition:transform .25s ease,background .25s ease,box-shadow .25s ease,border-color .25s ease}
.enter::before{content:"";position:absolute;inset:5px;border:1px solid rgba(214,173,100,.28);border-radius:3px 13px 3px 13px;pointer-events:none}
.enter::after{content:"✦";position:absolute;right:13px;top:50%;transform:translateY(-51%);font-size:11px;color:#e6c98f;opacity:.95}
.enter:hover{transform:translate(-50%,-53%);background:linear-gradient(180deg,rgba(10,82,105,.97),rgba(5,62,82,.98));border-color:rgba(246,226,188,.95);box-shadow:0 13px 34px rgba(0,29,40,.4),inset 0 1px 0 rgba(255,255,255,.16)}
.enter:focus-visible{outline:3px solid rgba(255,255,255,.9);outline-offset:4px}
.enter-arrow{font-size:20px;line-height:1;transform:translateY(-1px)}
@media(max-width:700px){
.scene-image{object-position:center center}
.identity{top:38%;width:88vw}
.logo{width:180px;max-width:180px}
.title{margin-top:6px;font-size:clamp(25px,7.2vw,34px)}
.subtitle{font-size:clamp(12px,3.6vw,17px)}
.tagline{font-size:clamp(10px,3vw,14px)}
.ornament{width:38vw}
.enter{top:84%;min-width:188px;min-height:50px;padding-inline:26px 30px;border-radius:5px 15px 5px 15px}
.enter::before{inset:4px;border-radius:3px 11px 3px 11px}
.enter::after{right:11px}
}
@media(max-height:650px) and (min-width:701px){
.identity{top:36%}
.enter{top:85%}
}
@media(prefers-reduced-motion:reduce){.enter{transition:none}.enter:hover{transform:translate(-50%,-50%)}}
</style>
</head>
<body>
<main class="scene" aria-label="شهیدپورتال | پورتال جامع شهدا">
<picture>
  <source srcset="assets/images/introback.webp" type="image/webp">
  <img class="scene-image" src="assets/images/introback.png" alt="" width="1672" height="940" fetchpriority="high" decoding="async">
</picture>
<section class="identity" aria-label="شهیدپورتال">
  <picture>
    <source srcset="assets/images/logo.webp" type="image/webp">
    <img class="logo" src="assets/images/logo.png" alt="لوگوی شهیدپورتال" width="300" height="261" decoding="async">
  </picture>
  <div class="title">شهیدپورتال</div>
  <div class="subtitle">پورتال جامع شهدا</div>
  <div class="tagline">یادشان راه ماست...</div>
  <span class="ornament" aria-hidden="true"></span>
</section>
<a class="enter" href="tarhha/shahidportal-tarh.html">
  <span>ورود به پورتال</span>
  <span class="enter-arrow" aria-hidden="true">←</span>
</a>
</main>
</body>
</html>

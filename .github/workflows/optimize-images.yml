name: Optimize portal images

on:
  push:
    branches: [main]
    paths:
      - "assets/images/logo.png"
      - ".github/workflows/optimize-images.yml"

permissions:
  contents: write

jobs:
  optimize-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image tooling
        run: npm install --no-save sharp

      - name: Create optimized logo WebP
        run: |
          node - <<'NODE'
          const sharp = require('sharp');
          (async () => {
            await sharp('assets/images/logo.png')
              .webp({ quality: 92, effort: 6 })
              .toFile('assets/images/logo.webp');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Commit optimized asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/logo.webp
          git diff --cached --quiet || git commit -m "Optimize portal logo as WebP"
          git push
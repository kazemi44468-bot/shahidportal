<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#dcecf0">
<meta name="description" content="شهیدپورتال | پورتال جامع شهدا">
<title>شهیدپورتال | پورتال جامع شهدا</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Vazirmatn;src:url("assets/fonts/Vazirmatn-Black.woff2") format("woff2");font-weight:900;font-display:swap}
:root{--navy:#07354a;--deep:#052d42;--gold:#bd8b37;--gold2:#e7c979;--green:#15935b;--red:#c92b31}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#dbecef;color:var(--navy)}
a{text-decoration:none;color:inherit}
.scene{position:relative;width:100vw;height:100vh;min-height:620px;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,#83bad0 0%,#d9e9eb 48%,#e8eee9 62%,#bdd6d6 100%)}
.sky{position:absolute;inset:0;z-index:-20;background:
radial-gradient(circle at 73% 34%,rgba(255,248,220,.98) 0 4%,rgba(255,247,216,.65) 9%,rgba(255,247,216,.18) 19%,transparent 31%),
radial-gradient(ellipse at 49% 7%,rgba(255,255,255,.55),transparent 29%),
linear-gradient(180deg,#4d94b0 0%,#b9d7e0 40%,#edf2ed 62%,#d7e1dc 100%)}
.clouds{position:absolute;inset:0;z-index:-18;opacity:.68;background:
radial-gradient(ellipse at 16% 12%,rgba(255,255,255,.9) 0 4%,transparent 12%),
radial-gradient(ellipse at 39% 18%,rgba(255,255,255,.72) 0 5%,transparent 14%),
radial-gradient(ellipse at 77% 10%,rgba(255,255,255,.85) 0 5%,transparent 15%),
radial-gradient(ellipse at 61% 30%,rgba(255,255,255,.42) 0 4%,transparent 12%)}
.mist{position:absolute;left:-5%;right:-5%;top:42%;height:30%;z-index:-10;background:radial-gradient(ellipse at center,rgba(255,255,255,.82),transparent 69%);filter:blur(15px)}
.mountains{position:absolute;left:-5%;width:110%;bottom:27%;height:34%;z-index:-8}
.mountains:before,.mountains:after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 0 7%,#7ea3ad 7.2% 8%,transparent 8.2% 13%,#9bb9c0 13.2% 14%,transparent 14.2% 21%,#7698a4 21.2% 22%,transparent 22.2% 29%,#a9c3c8 29.2% 30%,transparent 30.2% 38%,#789ca7 38.2% 39%,transparent 39.2% 48%,#a6bec4 48.2% 49%,transparent 49.2% 59%,#789aa5 59.2% 60%,transparent 60.2% 69%,#a9c0c4 69.2% 70%,transparent 70.2% 100%);clip-path:polygon(0 100%,0 61%,7% 52%,12% 70%,20% 37%,27% 66%,35% 31%,42% 64%,51% 29%,59% 66%,67% 41%,74% 68%,83% 35%,91% 64%,100% 43%,100% 100%);opacity:.7}
.mountains:after{transform:scale(1.06) translateY(13px);opacity:.38;filter:blur(2px)}
.foothills{position:absolute;left:-5%;width:110%;bottom:23%;height:18%;z-index:-7;background:linear-gradient(180deg,#5f8790,#315a68);clip-path:polygon(0 75%,9% 53%,19% 63%,31% 41%,44% 67%,56% 47%,69% 69%,80% 48%,91% 64%,100% 42%,100% 100%,0 100%);opacity:.82}
.water{position:absolute;left:0;right:0;bottom:0;height:38%;z-index:-6;background:
linear-gradient(180deg,rgba(126,174,181,.15),rgba(30,88,104,.52) 42%,#0d455a 100%),
repeating-linear-gradient(178deg,rgba(255,255,255,.17) 0 1px,transparent 1px 13px)}
.water:before{content:"";position:absolute;left:35%;top:-4%;width:45%;height:125%;background:radial-gradient(ellipse,rgba(255,247,207,.58),transparent 61%);filter:blur(9px)}
.sun{position:absolute;z-index:-5;right:25%;bottom:30%;width:15vmin;height:15vmin;min-width:72px;min-height:72px;border-radius:50%;background:radial-gradient(circle,#fffdf1 0 27%,rgba(255,248,210,.75) 42%,transparent 72%);filter:blur(.4px)}
.flag{position:absolute;z-index:-3;width:55vw;max-width:840px;height:170px;top:7%;opacity:.72;filter:drop-shadow(0 10px 16px rgba(0,30,40,.13))}
.flag.left{left:-13%;transform:rotate(13deg)}
.flag.right{right:-13%;transform:scaleX(-1) rotate(13deg)}
.flag path{fill:none;stroke-linecap:round}
.arch{position:absolute;z-index:-2;right:8%;bottom:22%;width:min(19vw,300px);min-width:150px;height:auto;opacity:.75;filter:drop-shadow(0 12px 18px rgba(0,34,46,.18))}
.landmark{position:absolute;z-index:-2;right:10%;bottom:25%;width:min(13vw,190px);height:30%;min-width:110px}
.landmark:before{content:"";position:absolute;left:35%;bottom:0;width:31%;height:78%;background:linear-gradient(100deg,#d9e4e1,#718d91 52%,#dbe6e2);clip-path:polygon(35% 0,64% 0,75% 100%,25% 100%);filter:drop-shadow(0 3px 4px rgba(0,0,0,.12))}
.landmark:after{content:"";position:absolute;left:12%;bottom:2%;width:77%;height:31%;background:#b9cbc7;clip-path:polygon(50% 0,70% 23%,87% 100%,13% 100%,30% 23%);opacity:.9}
.logo-wrap{position:absolute;z-index:4;left:50%;top:7%;transform:translateX(-50%);width:min(43vw,590px);display:flex;justify-content:center}
.logo{width:100%;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(10,46,61,.15))}
.content{position:absolute;z-index:8;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:0 18px 8.5vh;text-align:center}
.card{display:flex;flex-direction:column;align-items:center;width:min(650px,92vw)}
.title{font-size:clamp(39px,5.8vw,74px);font-weight:900;line-height:1.08;color:#123d50;letter-spacing:-2px;text-shadow:0 2px 2px rgba(255,255,255,.55);margin:0}
.subtitle{margin:9px 0 0;font-size:clamp(17px,2.2vw,28px);font-weight:700;color:#173f50}
.motto{margin:12px 0 0;color:rgba(18,57,72,.57);font-size:clamp(13px,1.55vw,18px)}
.rule{width:370px;max-width:65vw;height:1px;margin:10px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.enter{display:inline-flex;align-items:center;justify-content:center;gap:18px;margin-top:22px;width:224px;height:54px;border:1.5px solid #d1a24e;border-radius:999px;background:linear-gradient(135deg,#075071,#0b3549);color:#fff;font-weight:700;font-size:16px;box-shadow:0 12px 26px rgba(2,36,51,.24),inset 0 1px rgba(255,255,255,.18);transition:transform .25s ease,box-shadow .25s ease}
.enter:hover{transform:translateY(-3px);box-shadow:0 17px 30px rgba(2,36,51,.3)}
.enter .arrow{font-size:26px;font-family:Arial,sans-serif;line-height:1}
.ornament{margin-top:18px;width:420px;max-width:68vw;height:24px;display:flex;align-items:center;gap:14px;justify-content:center;color:var(--gold)}
.ornament:before,.ornament:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold))}
.ornament:after{background:linear-gradient(90deg,var(--gold),transparent)}
.ornament i{width:15px;height:15px;border:2px solid var(--gold);transform:rotate(45deg);display:block;position:relative}
.ornament i:after{content:"";position:absolute;inset:3px;border:1px solid var(--gold)}
.petals{position:absolute;inset:0;z-index:2;pointer-events:none}
.petal{position:absolute;width:10px;height:17px;background:#c93337;border-radius:80% 12% 80% 12%;box-shadow:0 3px 8px rgba(120,20,25,.16);animation:fall 9s linear infinite}
.p1{left:18%;top:47%;animation-delay:-1s}.p2{left:31%;top:66%;animation-delay:-6s}.p3{right:19%;top:54%;animation-delay:-4s}.p4{right:29%;top:68%;animation-delay:-8s}.p5{left:8%;top:39%;animation-delay:-3s}
@keyframes fall{0%{transform:translate3d(0,-20px) rotate(10deg);opacity:0}15%{opacity:.85}55%{transform:translate3d(35px,110px) rotate(105deg)}100%{transform:translate3d(80px,220px) rotate(180deg);opacity:0}}
@media(max-width:900px){.logo-wrap{top:8%;width:min(65vw,510px)}.arch{right:3%;opacity:.48}.landmark{right:2%;opacity:.72}.content{padding-bottom:7vh}.title{font-size:clamp(35px,8vw,58px)}}
@media(max-width:600px){.scene{min-height:560px}.logo-wrap{top:7%;width:78vw}.arch{right:-5%;bottom:26%;width:28vw;min-width:90px;opacity:.34}.landmark{right:-3%;bottom:29%;width:25vw;opacity:.58}.flag{width:100vw;height:130px;top:9%;opacity:.55}.flag.left{left:-48%}.flag.right{right:-48%}.mountains{bottom:30%;height:29%}.water{height:34%}.content{padding:0 12px 6.5vh}.subtitle{margin-top:6px}.motto{margin-top:8px}.enter{margin-top:17px;width:210px;height:50px}.ornament{margin-top:13px}.petals .p5{display:none}}
@media(prefers-reduced-motion:reduce){.petal,.enter{animation:none;transition:none}}
</style>
</head>
<body>
<main class="scene">
<div class="sky"></div><div class="clouds"></div><div class="mist"></div>
<div class="sun"></div><div class="mountains"></div><div class="foothills"></div><div class="water"></div>
<svg class="flag left" viewBox="0 0 1000 220" aria-hidden="true">
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#168f5b" stroke-width="48"/>
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#f7faf9" stroke-width="30"/>
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#c92e34" stroke-width="13"/>
</svg>
<svg class="flag right" viewBox="0 0 1000 220" aria-hidden="true">
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#168f5b" stroke-width="48"/>
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#f7faf9" stroke-width="30"/>
<path d="M-20 95C160 15 300 25 475 108S770 190 1030 62" stroke="#c92e34" stroke-width="13"/>
</svg>
<div class="landmark" aria-hidden="true"></div>
<svg class="arch" viewBox="0 0 300 430" aria-hidden="true">
<defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#eef4f0"/><stop offset=".48" stop-color="#829b9d"/><stop offset="1" stop-color="#e8efec"/></linearGradient></defs>
<path d="M55 414V150C55 80 95 34 150 5c55 29 95 75 95 145v264" fill="url(#a)" stroke="#708a8c" stroke-width="2"/>
<path d="M83 414V158c0-51 25-88 67-115 42 27 67 64 67 115v256" fill="none" stroke="#f1f5f2" stroke-width="12"/>
<path d="M112 414V176c0-29 14-51 38-69 24 18 38 40 38 69v238" fill="#d7e3df"/>
<path d="M101 224h98M96 258h108M91 294h118" stroke="#718b8d" stroke-width="3" opacity=".55"/>
</svg>
<div class="logo-wrap"><img class="logo" src="assets/images/logo.png" alt="لوگوی شهیدپورتال"></div>

<section class="content">
<div class="card">
<h1 class="title">شهیدپورتال</h1>
<div class="subtitle">پورتال جامع شهدا</div>
<div class="rule"></div>
<div class="motto">یادشان، راه ماست...</div>

<div class="ornament" aria-hidden="true"><i></i></div>
</div>
</section>
</main>
</body>
</html>

<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مکان‌ها | تقویم شهدا</title><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/calendar.css"><link rel="stylesheet" href="assets/css/calendar-shell.css"></head><body><div id="calendarShellHeader"></div><main class="page"><section class="pageHero"><span>اطلس مکان</span><h1>مکان‌ها</h1><p>مکان‌هایی که در پرونده اشخاص و رویدادهای تقویم نقش دارند.</p></section><section id="list" class="entityGrid"></section></main><div id="calendarShellFooter"></div><script src="assets/js/calendar-shell.js"></script><script src="assets/js/data-loader.js"></script><script>(async()=>{const d=await loadCalendarData();document.getElementById("list").innerHTML=d.places.map(p=>"<article class='entityCard'><span>مکان تاریخی</span><h2>"+p.name+"</h2><p>"+p.region+" · "+p.country+"</p><small>"+p.related+"</small></article>").join("")})()</script></body></html>
